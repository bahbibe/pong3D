<body>
  <div id="app"></div>
  <!--! Chat page -->
  <template id="chat-page">
    <div class="profile-container">
      <template id="profile">
        <h1>Profile</h1>
        <img class="avatar" id="profile-avatar" src="" alt="Avatar" />
        <span id="profile-username"></span>
      </template>
    </div>
    <div class="friends-container">
      <template id="friends">
        <h1>Friends</h1>
        <ul id="friends-list">
        </ul>
      </template>
    </div>
    <div class="chat-container">
      <template id="chat">
        <h1>Chat</h1>
        <div id="chat-messages">
        </div>
        <form id="chat-form">
          <input id="chat-input" type="text" placeholder="Type a message...">
          <button type="submit">Send</button>
        </form>
      </template>
    </div>
  </template>
  <!--! Home page -->
  <template id="home-page">
    <section class="d-flex">
      <aside-nav></aside-nav>
      <div class="main">
        <main-nav></main-nav>
         <main class="p-3">
              <div class="container-fluid">
              </div>
          </main>
      </div>
    </section>
  </template>
  <!--! Login page -->
  <template id="login-page">
    <section>
     <div class="container-lg d-flex justify-content-center align-items-center text-black min-vh-100 font-monospace">
      <div class="col-lg-8 col-md-6 flex-column pe-5 left-box text-color ">
          <h1 class="title">PONG</h1>
          <p class="fs-1 text-light  pe-xxl-5 fw-medium" >
            pong help you to enjoy the moment with your friend
          </p>
      </div>
       <div class="col-lg-4 col-md-6 col-sm-8  box-padding rounded right-box" style="background-color: #EAE0F2;">
        <ul class="nav nav-pills nav-justified mb-3" id="ex1" role="tablist">
           <li class="nav-item" role="presentation">
             <a href="#" class="nav-link active" id="tab-login"  role="tab"
               aria-controls="pills-login" aria-selected="false">Login</a>
              </li>
               <li class="nav-item" role="presentation">
                 <a href="#" class="nav-link " id="tab-register"  role="tab"
                   aria-controls="pills-register" aria-selected="true">Register</a>
               </li>
        </ul>
         <div class="row align-items-center" id="login">
            <div class="mb-4">
                  <h2>Welcome Back</h2>
            </div>
            <form action="" method="post" id="login-form">
              <div class="input-group mb-3">
                  <input type="email" class="form-control form-control-lg bg-light fs-6" placeholder="Email address" data-email>
              </div>
              <div class="input-group mb-1">
                  <input type="password" class="form-control form-control-lg bg-light fs-6" placeholder="Password" data-password>
              </div>
              <div class="input-group mb-5 d-flex justify-content-between">
                  <div class="form-check">
                      <input type="checkbox" class="form-check-input" id="formCheck">
                      <label for="formCheck" class="form-check-label text-secondary"><small>Remember Me</small></label>
                  </div>
                  <div class="forgot">
                      <small><a href="#">Forgot Password?</a></small>
                  </div>
              </div>
              <div class="input-group mb-3">
                  <button class="btn btn-lg bg-btn-primary w-100 fs-6 fw-bold" data-login type="submit" >Login</button>
              </div>
              <div class="input-group mb-3">
                  <button class="btn btn-lg btn-dark w-100 fs-6 fw-bold" type="button" id="intra"><small class="me-2">Sign In with </small><img src="/static/asset/images/42.svg" style="width:20px" ></button>
              </div>
            </form>
         </div>
          <div class="row align-items-center hidden" id="register">
            <form action="" method="POST" id="register-form">
              <div class="input-group mb-3">
                  <input type="text"  class="form-control form-control-lg"  placeholder="First name"  id="firstName" required />
              </div>
              <div class="input-group mb-3">
                  <input type="text" class="form-control form-control-lg" placeholder="last name" id="lastName" required />
              </div>
              <div class="input-group mb-3">
                  <input type="email" class="form-control form-control-lg bg-light fs-6" placeholder="Email address" id="email" required />
              </div>
              <div class="input-group mb-3">
                  <input type="password" class="form-control form-control-lg bg-light fs-6" placeholder="Password" id="password" required />
              </div>
              <div class="input-group mb-3">
                  <input type="password"  class="form-control form-control-lg bg-light fs-6" placeholder="Password" id="confirm-password" required />
              </div>
              <!-- <div class="input-group mb-5 d-flex justify-content-between">
                  
              </div> -->
              <div class="input-group mb-3">
                <input type="file" class="form-control" id="data-upload-image"  required />
                <!-- <label class="input-group-text" for="inputGroupFile02">Upload</label> -->
              </div>
              <div class="input-group mb-3">
                  <button class="btn btn-lg btn-primary w-100 fs-6 fw-bold" data-register >Login</button>
              </div>
            </form>
          </div>
       </div> 
      </div>
    </div>
    </section>
  </template>

                <h1 class="m-0" id="firstName">Welcome Back, Bilal</h1>
                <p class="text-muted">feel free to be part of our world, and enjoy the momnent.</p>
              </div>  
            </div>
            <div class="row mt-5 mx-auto">
            <div class="col-12">

              <div class="mycard">
                <div class="content">
                  <h5 class="heading">Play With Bot</h5>
                  <p class="details">Flex it up as you wish, but you can't break it.</p>

                </div>
                <div class="image">
                  <img src="/static/asset/images/bot-img-Photoroom.png" class="bot" alt="">
                </div>
              </div>
              
            </div>
            </div>
          </div>
        </main>
      </div>
    </section>
    </div>
  </template>
