<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PONG</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="/static/css/index.css" />
  <!-- !google font link -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&display=swap" rel="stylesheet" />
  <!-- !frontend awesome icon library -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <div id="app"></div>
  <!--! Login page -->
  <template id="login-page">
    <form id="login-form">
      <h1>Login</h1>
      <div class="form-group">
        <input id="username" class="form-control" name="user" type="text" placeholder="Username" required>
        <input id="password" type="password" class="form-control" name="pass" placeholder="Password" required>
        <button type="submit">Submit</button>
      </div>
    </form>
  </template>

  <!--! Chat page -->
  <template id="chat-page">
    <div class="profile-container">
      <template id="profile">
        <h1>Profile</h1>
        <img class="avatar" id="profile-avatar" src="" alt="Avatar" />
        <span id="profile-username"></span>
      </template>
    </div>
    <div class="friends-container">
      <template id="friends">
        <h1>Friends</h1>
        <ul id="friends-list">
        </ul>
      </template>
    </div>
    <div class="chat-container">
      <template id="chat">
        <h1>Chat</h1>
        <div id="chat-messages">
        </div>
        <form id="chat-form">
          <input id="chat-input" type="text" placeholder="Type a message..." >
          <button type="submit">Send</button>
        </form>
      </template>
    </div>
  </template>

  <!--! Home page -->
  <template id="home-page">
    <div class="home">
      <section>
        <h1 class="title">PONG</h1>
        <img src="./asset/images/Rectangle4.jpg/" class="racket r1" alt="" />
        <img src="/asset/images/Rectangle4.jpg" class="racket r2" alt="" />
        <div class="pong-group">
          <a href="/login" class="button login"> login <i class="fa-solid fa-user fa-xs"></i> </a>
          <a href="/" class="button register"> register </a>
          <a href="/" class="button login-42"> login with 42</a>
        </div>
      </section>
    </div>
  </template>


  <template id="not-found-page">
    <h1>404 Not Found</h1>
    <p>Sorry, the page you are looking for does not exist.</p>
  </template>



  <script type="module" src="/static/js/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>

</html>
