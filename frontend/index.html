  <template id="home-page">
    <section class="m-2">
      <div class="container-md">
        <h1 class="vt323-regular display-1 text-center border-bottom fw-bold">PO-NG</h1>
        <div class="pong-history row justify-content-between align-items-center p-3">
          <h2 class="vt323-regular display-3 fw-bold mt-3">Pong History</h2>
          <div class="image col-12 col-lg-6">
            <img src="/static/asset/images/1970-pong.png" class="img-fluid">
          </div>
          <div class="description vt323-regular fs-4 p-3 col-12 col-lg-5">
            <h2>1972: Birth of Atari Pong</h2>
            <p>
              The year 1972 marked a pivotal moment in gaming history with the release of "Pong" by Atari, developed by Nolan Bushnell and Allan Alcorn.
              It became the first commercially successful video game,
              captivating audiences with its simple yet addictive gameplay. Pong simulated table tennis,
              featuring two paddles and a bouncing ball, controlled by players using dials.
              Its success sparked the arcade gaming revolution, laying the foundation for the industry we know today.
            </p>
            <a href="/login" class="join-btn btn btn-block bg-black text-white text-uppercase fs-3 px-4">join us</a>
          </div>
        </div>
        <div class="developer row justify-content-between align-items-center">
          <h2 class="vt323-regular display-3 divider col-12">Developers</h2>
          <div class="description vt323-regular fs-4 p-3 col-12 col-lg-6">
            <p>
              The developers of this project are a group of students from 1337 School, who are passionate about programming and game development.
              They have worked together to create this project as part of their curriculum, showcasing their skills and creativity.
            </p>
          </div>
          <div class="image col-12 col-lg-5">
            <img src="/static/asset/images/cluster.jpg" class="img-fluid">
          </div>
          <div class="team col-12 col-lg-6 p-3">
          </div>
        </div>
        <div class="our-team mb-5 row d-flex justify-content-between">
          <h2 class="vt323-regular display-3 divider">our team</h2>
          <div class="team-member text-center col-12 mb-4 col-md-6 col-lg-3">

          </div>
          <div class="team-member text-center col-12 mb-4 col-md-6 col-lg-3">

            <h4 class="vt323-regular fs-3 m-0 p-0">Marwane Ahansal </h4>
            <p class="vt323-regular fs-4 m-0  p-0 text-info-emphasis text-capitalize">fullstack Developer</p>
          </div>
          <div class="team-member text-center col-12 mb-4 col-md-6 col-lg-3">

  <!--! Login page -->
  <template id="login-page">
    <section>
      <div class="container-lg d-flex justify-content-center align-items-center text-black min-vh-100 font-monospace position-relative">
        <div class="col-lg-8 d-none d-lg-block flex-column pe-5 left-box text-color ">
          <h1 class="rubik-glitch-regular title">PO-NG</h1>
          <p class="text-light  pe-xxl-5 vt323-regular display-3 fw-bold">
            pong help you to enjoy the moment with your friend
          </p>
        </div>
        <div class="col-12 col-md-8 col-lg-5  box-padding rounded right-box glass-effect">
          <ul class="nav nav-pills nav-justified mb-3" id="ex1" role="tablist">
            <li class="nav-item" role="presentation">
              <a href="#" class="nav-link activeBtn fw-bold text-uppercase" id="tab-login" role="tab" aria-controls="pills-login"
                aria-selected="false" style="color: #fefefe;">Login</a>
            </li>
            <li class="nav-item" role="presentation">
              <a href="#" class="nav-link fw-bold text-uppercase" id="tab-register" role="tab" aria-controls="pills-register"
                aria-selected="true" style="color: #fefefe;">Register</a>
            </li>
          </ul>
          <div class="row align-items-center" id="login">
            <div class="mb-4">
              <h2 class="fw-bold" style="color: #110818;">Welcome Back</h2>
            </div>
            <form action="" method="post" id="login-form">
              <div class="input-group mb-3">
                <!-- <input type="email" class="form-control form-control-lg bg-light fs-6" placeholder="Email address"
                  data-email>
              </div> -->
              <div class="input-group mb-3">
                <input type="email" class="form-control form-control-lg bg-light fs-6" placeholder="Email address"
                  id="email" data-email required />
              </div>
              <div class="input-group mb-5">
                <input type="password" class="form-control form-control-lg bg-light fs-6" placeholder="Password"
                  data-password>
              </div>

              <div class="input-group mb-3">
                <button class="btn btn-lg w-100 fw-bold text-uppercase glass-effect" data-login type="submit" style="color: var(--darker)">Login</button>
              </div>
              <div class="input-group mb-3">
                <button class="btn btn-lg w-100 fw-bold text-uppercase glass-effect" type="button" id="intra" style="color: var(--darker)"><span class="me-2">Sign
                    In with </span><img src="/static/asset/images/42.svg" style="width:20px "></button>
              </div>
              <div id="login-errors">
                <error-toast></error-toast>
              </div>
            </form>
          </div>
          <div class="row align-items-center hidden" id="register">
            <form action="" method="POST" id="register-form">
              <div class="input-group mb-3">
                <input type="text" class="form-control form-control-lg" placeholder="First name" id="firstName"
                  required />
              </div>
              <div class="input-group mb-3">
                <input type="text" class="form-control form-control-lg" placeholder="last name" id="lastName"
                  required />
              </div>
              <div class="input-group mb-3">
                <input type="email" class="form-control form-control-lg bg-light fs-6" placeholder="Email address"
                  id="email" required />
              </div>
              <div class="input-group mb-3">
                <input type="password" class="form-control form-control-lg bg-light fs-6" placeholder="Password"
                  id="password" required />
              </div>
              <div class="input-group mb-3">
                <input type="password" class="form-control form-control-lg bg-light fs-6" placeholder="Password"
                  id="confirm-password" required />
              </div>
              <div class="text-white list-group">
                password must contain:
                <ul>
                  <li class="lengthPassword" style="font-size: 12px; color: red;"> At least 8 characters, [a,z], [A,Z],[0,9],[!&@...{}]</li>
                </ul>
              </div>

              <div class="input-group mb-3">
                <button class="btn btn-lg w-100 fw-bold text-uppercase glass-effect" data-register style="color: var(--darker)">Register</button>
              </div>
              <div id="register-errors">
                <error-toast></error-toast>
              </div>
            </form>
          </div>
        </div>
      </div>
      </div>
    </section>
