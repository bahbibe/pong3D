<body>

  <!--! Chat page -->

    <div class="profile-container">
      <template id="profile">
        <h1>Profile</h1>
        <img class="avatar" id="profile-avatar" src="" alt="Avatar" />

      </template>
    </div>
    <div class="friends-container">

        </ul>
      </template>
    </div>
    <div class="chat-container">

          <input id="chat-input" type="text" placeholder="Type a message...">

      </template>
    </div>
  </template>
  <!--! Home page -->
  <template id="home-page">
    <div class="home">
      <section>
        <h1 class="title">PONG</h1>
        <img src="./asset/images/Rectangle4.jpg/" class="racket r1" alt="" />
        <img src="/asset/images/Rectangle4.jpg" class="racket r2" alt="" />
        <div class="pong-group">
          <a href="/login" class="button login"> login <i class="fa-solid fa-user fa-xs"></i> </a>
          <a href="/" class="button register"> register </a>
          <a href="/" class="button login-42"> 
            login with
            <img src="/static/asset/images/42.svg" alt="" class="logo-42">
          </a>
        </div>
      </section>
    </div>
  </template>

     <div class="container-lg d-flex justify-content-center align-items-center min-vh-100">

      </p>

    <div class="col-lg-8 col-md-6 flex-column pe-5 left-box">

        <p class="fs-1 text-light  pe-xxl-5 fw-medium" style="font-family: monospace;">
          pong help you to enjoy the moment with your friend
        </p>
    </div>
       <div class="col-lg-4 col-md-6 col-sm-8 bg-white box-padding rounded right-box">
         <ul class="nav nav-pills nav-justified mb-3" id="ex1" role="tablist">
           <li class="nav-item" role="presentation">
             <a class="nav-link active" id="tab-login" data-mdb-pill-init href="" role="tab"

               <li class="nav-item" role="presentation">

                </div>

          <div class="row align-items-center hidden" id="register">

              </div>
              <div class="input-group mb-3">

                    <div class="form-check form-check-inline mb-0 me-4">

              <div class="input-group mb-3">
                  <button class="btn btn-lg btn-primary w-100 fs-6 fw-bold">Login</button>
              </div>
          </div>
       </div> 
      </div>
    </div>

  <!--! USER PROFILE  -->
  <template id="user-profile">

    <section class="my-5">
      <div class="container-md">
        <div class="row p-3 rounded text-white box-sh-1 secondary-bg">
          <div class="col-12 col-md-5">

                <img src="/static/asset/images/profile.svg" class="img-fluid" width="120" alt="user profile image">
                <div class="ps-2">
                  <h4 class="m-0 fw-bold text-capitalize">bilal makhloufi</h4>
                  <sapn>@bmakhlou</sapn>
                </div>
              </div>
          </div>

          <div class="col-12 col-md-7 col-lg-5 d-flex flex-wrap font-monospace align-items-center  justify-content-center text-center">
            <div class="total-match me-4 d-none d-sm-block">

                Total Maches
              </sapan>
              <sapan class="fw-bold">100</sapan>
            </div> 
            <div class="match-wins me-4">

                 wins
              </sapan>
              <sapan class="fw-bold">100</sapan>
            </div>

            </div>

            </div>

          <div class="rank col-2  d-lg-flex d-none align-items-center justify-content-end">

              </span>
              <span class="fw-bold">100</span>

            </div>
            <div class="col-2 my-auto text-center d-none d-md-block">
              <span class="result fw-bolder">WIN 🏆</span>
            </div>
          </div>
        </div>

   <template id="ranking-page">
    <main-nav></main-nav>

          <span class="fw-bolder">#1</span>
        </div>
      </div>
    </div>

   <template id="settings-page">
     <main-nav></main-nav>
     <section class="mt-5">
    <div class="">
      <form action="POST">
        <div class="d-flex justify-content-center mb-2">
            <img id="selectedAvatar" src="/static/asset/images/profile.svg"
            class="rounded-circle" style="width: 150px; height: 150px; object-fit: cover;" alt="profile image" />
        </div>
        <div class="d-flex justify-content-center">
            <div data-mdb-ripple-init class="btn btn-primary btn-rounded">
                <label class="form-label text-white m-1" for="userImg">Choose</label>
                <input type="file" class="form-control d-none" id="userImg" onchange="displaySelectedImage(event, 'selectedAvatar')" />
            </div>
        </div>
      </form>
    </div>
     </section>
