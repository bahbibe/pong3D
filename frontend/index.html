<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PONG</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />

  <!-- !frontend awesome icons library -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- !google font link -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&family=VT323&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/index.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="shortcut icon" href="/static/favicon.svg" type="image/x-icon">
  <!-- three.js is served from static/vendor (CSP allows no third-party
       scripts except the pinned Bootstrap bundle). If you edit this block,
       update its sha256 in the nginx Content-Security-Policy. -->
  <script type="importmap">{"imports": {"three": "/static/vendor/three-0.170.0/build/three.module.min.js", "three/addons/": "/static/vendor/three-0.170.0/examples/jsm/"}}</script>

</head>

<body class="styled-scrollbar">

  <div id="app"></div>
  <div class="overlay" id="overlay">
    <div class="custom-loader"></div>
  </div>
  <div id="toast-wrapper" class="position-absolute bottom-0 end-0">
    <div class="position-absolute bottom-0 end-0 p-3" style="z-index: 1000;">
      <div class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
          <strong class="me-auto"></strong>
          <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body">
        </div>
      </div>
    </div>
  </div>
  <!--! Chat page -->
  <template id="chat-page">
    <!-- <section> -->
    <main-nav></main-nav>
    <div class=" chat-container p-3 container-md d-flex ">
      <div class="side d-flex flex-column">
        <div class=" chat-heading p-3 me-2 mb-2 blur">
          <div class="px-2 d-flex gap-2 justify-content-center justify-content-md-start align-items-center ">
            <i class=" fa-solid fa-user-group fs-3"> </i>
            <span class="d-none d-md-flex fs-2"> Contacts</span>
          </div>
        </div>
        <div class="friends-list  blur py-1 me-2">
        </div>
      </div>
      <div class="chat-box blur col-10 col-md-8 p-0">
        <div class=" d-flex justify-content-center align-items-center h-100">
          <img src="/static/asset/images/no-message.png" class=" w-25 opacity-25" alt="chat image">
        </div>
      </div>
    </div>
    </div>
    <!-- </section> -->
  </template>

  <!-- Game page -->
  <template id="game-page">
    <style>
      canvas {
        position: fixed;
        top: 0;
        left: 0;
      }
    </style>
    <canvas id="game-canvas"></canvas>
  </template>

  <template id="matchmaking-page">
    <link rel="stylesheet" href="/static/css/loader.css">
    <section class="">
      <main-nav class="position-absolute w-100"></main-nav>
      <div class="d-flex min-vh-100 flex-column align-items-center justify-content-center">
        <h1 id="loader-message" class="mx-auto"></h1>
        <div class="loader mx-auto"></div>
        <a class="play px-3 py-1 fw-bold text-uppercase" style="color: var(--light); background: rgba(255, 255, 255, 0.1);
              border-radius: 5px;
              box-shadow: 0 2px 20px rgba(0, 0, 0, 0.7);" href="/Home" data-link=>Leave</a>
      </div>
    </section>
  </template>

  <template id="score-page">
    <main-nav></main-nav>
    <style>
      #score {
        font-size: xx-large;
      }

      .player {
        height: 100px;
        width: 100px;
        background-color: #624E88;
        border: #fefefe 1px solid;
        border-radius: 8px;
      }

      .player>img {
        height: 100%;
        width: 100%;
        border-radius: 8px;
      }
    </style>
    <div class="min-vh-100 d-flex align-items-center justify-content-evenly flex-column">
      <div id="score" class="score d-flex w-100 align-items-center justify-content-evenly">
        <div class="player player1 round-1"></div>
        <span id="player1_score">0</span>
        <span>-</span>
        <span id="player2_score">0</span>
        <div class="player player2 round-1"></div>
      </div>
      <div id="score" class="score d-flex w-100 align-items-center justify-content-evenly">
        <a class="play px-3 py-1 fw-bold text-uppercase" style="color: var(--light); background: rgba(255, 255, 255, 0.1);
              border-radius: 5px;
              box-shadow: 0 2px 20px rgba(0, 0, 0, 0.7);" href="/matchmaking" data-link=>Play Random</a>

        <a id="invite_game" class="play px-3 py-1 fw-bold text-uppercase" style="color: var(--light); background: rgba(255, 255, 255, 0.1);
              border-radius: 5px;
              box-shadow: 0 2px 20px rgba(0, 0, 0, 0.7);" href="" data-link=>Play Again<span></span></span></a>
        <a class="play px-3 py-1 fw-bold text-uppercase" style="color: var(--light); background: rgba(255, 255, 255, 0.1);
              border-radius: 5px;
              box-shadow: 0 2px 20px rgba(0, 0, 0, 0.7);" href="/Home" data-link=>Leave</a>
      </div>
    </div>
  </template>

  <template id="tour-page">
    <main-nav></main-nav>
    <section>
      <div class="container-md p-4 p-md-0">
        <h1 class="display-1 my-5">Tournament</h1>
        <div class="row align-items-center justify-content-evenly">
          <div class="secondary-bg p-2 tourCard tourCardBgImg CardBgImg1 mb-3 mb-md-0">
            <div class="overlay-card"></div>
            <button id="create_tour" href="#" class="btn btn-block btn-primary" style="z-index: 10;">Create
              Tournament</button>
          </div>
          <div class="secondary-bg tourCard tourCardBgImg CardBgImg2">
            <div class="overlay-card"></div>
            <button id="join_tour" href="#" class="btn btn-block btn-primary" style="z-index: 10;">Join
              Tournament</button>
          </div>
        </div>
      </div>
    </section>
  </template>
  <template id="join-page">
    <main-nav></main-nav>
    <section>
      <div class="container-md p-4">
        <h1>Join a Tournament </h1>
        <table class="table text-center mt-4">
          <thead class="thead-dark">
            <tr>
              <th scope="col">Tournament Id</th>
              <th scope="col">Players Number</th>
              <th scope="col">Join a Tournament</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>


      </div>
    </section>
  </template>

  <template id="tournament-display-page">
    <main-nav></main-nav>
    <section>
      <div class="theme theme-dark" style="overflow-x: auto;">
        <div class="bracket disable-image">
          <div class="column one">
            <div class="round1 game1 match winner-bottom">
              <div class="match-top team">
                <span class="image"></span>
                <span class="seed">1</span>
                <span class="name"></span>
                <span class="score">0</span>
              </div>
              <div class="match-lines">
                <div class="line one"></div>
                <div class="line two"></div>
              </div>
              <div class="match-lines alt">
                <div class="line one"></div>
              </div>
            </div>
            <div class="round1 game1 match winner-bottom">
              <div class="match-top team">
                <span class="image"></span>
                <span class="seed">4</span>
                <span class="name"></span>
                <span class="score">0</span>
              </div>
              <div class="match-lines">
                <div class="line one"></div>
                <div class="line two"></div>
              </div>
              <div class="match-lines alt">
                <div class="line one"></div>
              </div>
            </div>
            <div class="round1 game2 match winner-bottom">
              <div class="match-top team">
                <span class="image"></span>
                <span class="seed">2</span>
                <span class="name"></span>
                <span class="score">0</span>
              </div>
              <div class="match-lines">
                <div class="line one"></div>
                <div class="line two"></div>
              </div>
              <div class="match-lines alt">
                <div class="line one"></div>
              </div>
            </div>
            <div class="round1 game2 match winner-bottom">
              <div class="match-top team">
                <span class="image"></span>
                <span class="seed">3</span>
                <span class="name"></span>
                <span class="score">0</span>
              </div>
              <div class="match-lines">
                <div class="line one"></div>
                <div class="line two"></div>
              </div>
              <div class="match-lines alt">
                <div class="line one"></div>
              </div>
            </div>
          </div>
          <div class="column two">
            <div class="round2 game3 match winner-bottom">
              <div class="match-top team">
                <span class="image"></span>
                <span class="seed">1</span>
                <span class="name"></span>
                <span class="score">0</span>
              </div>
              <div class="match-lines">
                <div class="line one"></div>
                <div class="line two"></div>
              </div>
              <div class="match-lines alt">
                <div class="line one"></div>
              </div>
            </div>
            <div class="round2 game3 match winner-bottom">
              <div class="match-top team">
                <span class="image"></span>
                <span class="seed">2</span>
                <span class="name"></span>
                <span class="score">0</span>
              </div>
              <div class="match-lines">
                <div class="line one"></div>
                <div class="line two"></div>
              </div>
              <div class="match-lines alt">
                <div class="line one"></div>
              </div>
            </div>
          </div>
          <div class="column three">
            <div class="winner match winner-bottom">
              <div class="match-top team">
                <span class="image"></span>
                <span class="seed">5</span>
                <span class="name"></span>
                <span class="score">0</span>
              </div>
              <div class="match-lines">
                <div class="line one"></div>
                <div class="line two"></div>
              </div>
              <div class="match-lines alt">
                <div class="line one"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </section>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <script type="module" src="/static/js/main.js"></script>

</body>

</html>
