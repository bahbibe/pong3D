services:
  frontend:
    container_name: frontend
    build: ./
    ports:
      - "3000:3000"
    volumes:
      - ./:/frontend
      - node_modules:/frontend/node_modules
    restart: unless-stopped
    networks:
      - ft_transcendence

volumes:
  node_modules:
  
networks:
  ft_transcendence:
    name: ft_transcendence