[project]
name = "pong3d-e2e"
version = "0"
description = "Browser and websocket end-to-end tests against a running pong3D stack"
requires-python = ">=3.12,<3.13"
dependencies = [
    # The browser build follows this version: `uv run playwright install chromium`.
    "playwright==1.65.2",
    "pyotp==2.12.0",
    "pytest==9.2.0",
    "pytest-playwright==0.10.0",
    "requests>=2.34,<3",
    "websockets==17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--browser chromium --screenshot only-on-failure --tracing retain-on-failure --output test-results"
testpaths = ["."]
# The stacks use self-signed certificates.
filterwarnings = ["ignore::urllib3.exceptions.InsecureRequestWarning"]

[tool.ruff]
extend = "../backend/pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = []
