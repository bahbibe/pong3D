# Dev: code is bind-mounted. nginx serves ./frontend as it is on disk, so a
# browser refresh shows frontend edits. The backend restarts by itself when
# a .py file changes (running games are dropped on each restart).
services:
  backend:
    build:
      args:
        DEV: "1"
    # watchfiles restarts the command on .py changes. reset_presence runs on
    # each restart: the old process never ran its disconnect handlers, so its
    # online counts would stay. Set WATCHFILES_FORCE_POLLING=1 in .env if
    # changes are not seen (some Docker Desktop setups).
    command:
      - watchfiles
      - --filter
      - python
      - >-
        sh -c "python manage.py reset_presence
        && exec daphne -b 0.0.0.0 -p 8000 --proxy-headers ft_transcendence.asgi:application"
      - /backend
    volumes:
      - ./backend/backend:/backend
    ports:
      # Direct access for the seed script and /admin. Set BACKEND_PORT in
      # .env if 8000 is taken on your machine.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  nginx:
    ports:
      - "1337:1337"
    volumes:
      - ./frontend:/srv/frontend:ro
      # Uploaded avatars (written by the backend into the bind mount above).
      - ./backend/backend/avatars:/srv/avatars:ro
