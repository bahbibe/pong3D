# Install once: uvx pre-commit install
# Run on everything: uvx pre-commit run --all-files (CI does the same).
# Ruff reads its settings from backend/pyproject.toml.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        # compose and Ansible files use custom tags in a few places.
        args: [--unsafe]
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^frontend/static/vendor/
      - id: trailing-whitespace
        exclude: ^frontend/static/vendor/
