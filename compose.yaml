# Shared services. Run through the Makefile, which adds compose.dev.yaml or
# compose.prod.yaml on top (make dev / make prod) and sets PONG3D_ENV, the
# folder of the container env files: env/dev or env/prod (make env).
# prometheus and grafana are in the "tools" profile (make tools).
name: pong3d

services:
  db:
    # Pinned: postgres 18+ images refuse a volume at /var/lib/postgresql/data,
    # and a major upgrade needs pg_upgrade on the existing volume anyway.
    # The data volume is set by the dev/prod file.
    image: postgres:16-alpine
    env_file: env/${PONG3D_ENV:-dev}/db.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    init: true

  redis:
    image: redis:8.10.3-alpine
    env_file: env/${PONG3D_ENV:-dev}/redis.env
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    init: true

  # One-off job on each `up`: apply the migrations, then exit. The backend
  # starts only once it succeeded.
  migrate:
    build: ./backend/backend
    env_file: env/${PONG3D_ENV:-dev}/app.env
    entrypoint: []
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    # ONE REPLICA ONLY. Running games, bot games and the matchmaking state
    # live in this process's memory: a second backend would split games
    # between processes. Never scale this service; every restart or deploy
    # drops the games in progress.
    build: ./backend/backend
    env_file: env/${PONG3D_ENV:-dev}/app.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /healthz checks the database and Redis (not reachable through nginx).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    init: true

  nginx:
    # Serves the frontend and proxies /api and /ws to the backend.
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true

  prometheus:
    profiles: [tools]  # make tools
    image: prom/prometheus:v3.16.0
    volumes:
      - ./infra/prometheus/:/etc/prometheus/:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    restart: unless-stopped
    init: true

  grafana:
    profiles: [tools]  # make tools
    image: grafana/grafana:13.3.1
    env_file: env/${PONG3D_ENV:-dev}/grafana.env
    ports:
      # Local only. On a server: ssh -L 3000:127.0.0.1:3000 <server>
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    init: true
