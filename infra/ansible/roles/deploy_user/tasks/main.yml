- name: Docker group (the docker role reuses it)
  ansible.builtin.group:
    name: docker
    system: true

- name: Deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    groups: docker
    append: true
    password: "!"      # no password: SSH keys only
    update_password: on_create

- name: Deploy user SSH keys
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ deploy_authorized_keys }}"
  loop_control:
    label: "{{ item.split()[-1] if item.split() | length > 2 else item[:30] }}"
