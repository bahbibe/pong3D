# Dev (and the default): self-signed certificate on https://localhost:1337.
server {
    listen 1337 ssl;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    set $hsts_header "";
    include /etc/nginx/pong3d/common.conf;
}

server {
    listen 80;
    return 301 https://$host:1337$request_uri;
}
