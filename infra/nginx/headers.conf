# Security headers. Included at server level and again in every location
# that has its own add_header (nginx drops inherited add_header there).
# $hsts_header is set by the server block (empty in dev: no HSTS).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header Strict-Transport-Security $hsts_header always;
