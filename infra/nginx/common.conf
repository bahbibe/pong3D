# Routing shared by the dev and prod server blocks: nginx serves the frontend
# files itself and proxies the API and WebSockets, all on one origin, so the
# browser never needs CORS and the auth cookie stays first-party.

# Avatar uploads.
client_max_body_size 5m;

# Docker DNS. The backend is resolved at request time (proxy_pass with a
# variable), so nginx starts even when the backend is down and keeps working
# when the container is recreated with a new IP.
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend http://backend:8000;

include /etc/nginx/pong3d/headers.conf;

location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location /ws/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 1h;
}

location /avatars/ {
    alias /srv/avatars/;
}

# /healthz, /metrics and /admin/ are not proxied on purpose (they fall
# through to index.html below).

# Frontend: /srv/frontend comes from the image (prod) or a bind mount of
# ./frontend (dev).
location /static/ {
    alias /srv/frontend/static/;
}

# Every other path is a client-side route: always answer index.html, and
# never serve other files from the frontend folder.
location / {
    root /srv/frontend;
    try_files /index.html =404;

    include /etc/nginx/pong3d/headers.conf;
    add_header Cache-Control no-cache always;
    # Scripts: our own files, the inline importmap (by hash; recompute it
    # when frontend/index.html's importmap changes) and the pinned Bootstrap
    # bundle. Styles allow 'unsafe-inline' for the many style="" attributes.
    # blob: is how GLTFLoader hands textures to the GPU. Avatars come from
    # this origin or from the 42 intra CDN.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-7JJKcnmKHu2bip6XGRtyCEql8LHIBZiExwewr2CPWoA=' https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/ https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/ https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/ https://fonts.gstatic.com; img-src 'self' data: blob: https://cdn.intra.42.fr; connect-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}
