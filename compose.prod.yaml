# Prod: images only, no bind mounts, nothing published except nginx's
# HTTP/HTTPS ports. Let's Encrypt via certbot (make cert).
#
# App images: CI pushes ghcr.io/bahbibe/pong3d-{backend,nginx}:<commit sha>.
# On the server, infra/scripts/deploy.sh <sha> sets IMAGE_TAG and pulls them.
# Locally, `make prod` builds them from source and tags them :local.
x-backend-image: &backend-image ${IMAGE_PREFIX:-ghcr.io/bahbibe}/pong3d-backend:${IMAGE_TAG:-local}

services:
  migrate:
    image: *backend-image

  db:
    volumes:
      # Not the dev volume: a prod stack on a dev machine gets its own data.
      - pgdata:/var/lib/postgresql/data

  backend:
    image: *backend-image
    volumes:
      - avatars:/backend/media/avatars

  nginx:
    image: ${IMAGE_PREFIX:-ghcr.io/bahbibe}/pong3d-nginx:${IMAGE_TAG:-local}
    environment:
      NGINX_SITE: prod
    env_file: env/prod/nginx.env
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - avatars:/srv/avatars:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:v5.10.0
    # Renewal loop (certbot only renews certificates close to expiry). The
    # first certificate comes from `make cert`; nginx reloads every 6 h.
    entrypoint:
      - /bin/sh
      - -c
      - "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    restart: unless-stopped
    init: true

volumes:
  pgdata:
  # Filled from the backend image on first use (default avatar included).
  avatars:
  letsencrypt:
  certbot-www:
