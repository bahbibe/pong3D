openapi: 3.0.3
info:
  title: pong3D API
  version: '1'
  description: 'Every response is JSON: {success, message, data}. Errors have success:
    false, a message and, for invalid fields, errors (one message per field). Authentication
    is the access_token cookie set by login; with 2FA on, the token only opens the
    2FA endpoints until the code is verified (other endpoints answer 200 with data.is_tfa_verified
    = false).'
paths:
  /api/auth/intra/:
    get:
      operationId: auth_intra_retrieve
      summary: 'Start a 42 intra login: the URL to send the browser to'
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntraLoginResponse'
          description: ''
  /api/auth/intra/callback/:
    get:
      operationId: auth_intra_callback_retrieve
      summary: 42 intra redirects here; logs in and redirects to the frontend
      parameters:
      - in: query
        name: code
        schema:
          type: string
        description: Authorization code from 42
      - in: query
        name: error
        schema:
          type: string
        description: Set by 42 when the user refused
      - in: query
        name: state
        schema:
          type: string
        description: Must match the state cookie set by /intra/
      tags:
      - auth
      security:
      - {}
      responses:
        '302':
          description: 'Logged in: redirect to the frontend'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      summary: Log in with email or username and password; sets the access_token cookie
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginUserRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: 'Log out: ends every session of the user and deletes the cookie'
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/auth/me/:
