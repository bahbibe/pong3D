      operationId: game_leaderboard_retrieve
      description: |-
        ?page= (from 1) and ?size= (default 20, at most 100). Every row has
        its rank; "me" is the caller's rank and stats.
      summary: One page of the leaderboard, best ratio first, with your rank
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: From 1; past the end gives the last page
      - in: query
        name: size
        schema:
          type: integer
        description: Default 20, at most 100
      tags:
      - games
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/game/play_again/{game_id}:
    post:
      operationId: game_play_again_create
      summary: New game against the opponent of one of your games
      parameters:
      - in: path
        name: game_id
        schema:
          type: integer
        required: true
      tags:
      - games
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayAgainResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/game/stats/:
    get:
      operationId: game_stats_retrieve
      summary: Your game stats
      tags:
      - games
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
