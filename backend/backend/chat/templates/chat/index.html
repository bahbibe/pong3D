{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static '/css/style.css' %}">
    <title>Document</title>
</head>

<body>
    <h1>Channels</h1>

    <form id="chat-form">
        <input type="text" name="message" id="message">
        <button type="submit">Send</button>
    </form>
    <div id="chat-messages">

    </div>
    <div id="chat-messages">
        <button id="chat-button">Chat
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" class="feather feather-message-circle">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12c0 5.52 4.48 10 10 10 5.52 0 10-4.48 10-10 0-5.52-4.48-10-10-10zm-1 7H7v2h4v2l3-3-3-3v2z">
                </path>
            </svg>
        </button>
    </div>
</body>


<script>
    let url = `ws://${window.location.host}/ws/chat/`
    const socket = new WebSocket(url)

    socket.onopen = (e) => {
        console.log('Connection established')
    }
    socket.onmessage = (e) => {
        let data = JSON.parse(e.data)
        if (data.type === 'chat-message') {
            let message = document.querySelector('#chat-messages')
            message.insertAdjacentHTML('beforeend', `<p>${data.message}</p>`)
        }
    }
    let form = document.querySelector('#chat-form')
    form.addEventListener('submit', (e) => {
        e.preventDefault()
        let message = e.target.message.value
        socket.send(JSON.stringify({
            message: message
        }))
        form.reset()
    })
    const chatMessages = document.querySelector('#chat-messages')
    const chatButton = document.querySelector('#chat-button')


</script>

{% include 'chat/chat.html' %}
</html>
