volumes:
  dbdata:
networks:
  ft_transcendence:
services:
  backend:
    image: backend
    container_name: backend
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/backend
    env_file:
      - ./backend/.env
    depends_on:
      - db
    restart: unless-stopped
    init: true
    networks:
      - ft_transcendence

  db:
    image: postgres:15.6-alpine3.19
    container_name: db
    restart: unless-stopped
    init: true
    env_file:
      - ./backend/.env
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - ft_transcendence

  adminer:
    image: adminer
    container_name: adminer
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    networks:
      - ft_transcendence
    env_file:
      - ./backend/.env

