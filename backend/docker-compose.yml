volumes:
  dbdata:
networks:
  ft_transcendence:

services:
  backend:
    container_name: backend
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/backend
    depends_on:
      - db
    env_file:
      - ./backend/.env
    networks:
      - ft_transcendence
    restart: always
    init: true

  db:
    image: postgres:15.6-alpine3.19
    container_name: db
    volumes:
      - dbdata:/var/lib/postgresql/data
    env_file:
      - ./backend/.env
    networks:
      - ft_transcendence
    restart: always
    init: true

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    networks:
      - ft_transcendence
    restart: always
    init: true

  redis:
    image: redis
    container_name: redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - ft_transcendence
    env_file:
      - ./backend/.env
