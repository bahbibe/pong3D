volumes:
  dbdata:
    name: dbdata
networks:
  ft_transcendence:
    name: ft_transcendence
services:
  backend:
    container_name: backend
    build: ./backend
    volumes:
      - ./backend:/backend
    depends_on:
      - db
      - redis
    ports:
      # Local only (seed script, admin). Browsers go through nginx.
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    networks:
      - ft_transcendence
    restart: always
    init: true
  db:
    # Pinned: postgres 18+ images refuse a volume at /var/lib/postgresql/data,
    # and a major upgrade needs pg_upgrade on the existing volume anyway.
    image: postgres:16-alpine
    container_name: db
    volumes:
      - dbdata:/var/lib/postgresql/data
    env_file:
      - ./backend/.env
    networks:
      - ft_transcendence
    restart: always
    init: true
  adminer:
    image: adminer:6.3.0
    container_name: adminer
    ports:
      - "127.0.0.1:8080:8080"
    # Not the app .env: adminer does not need JWT or OAuth secrets.
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - ft_transcendence
    restart: always
    init: true
  redis:
    image: redis:8.10.3-alpine
    container_name: redis
    networks:
      - ft_transcendence
    restart: always
    init: true
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/:/etc/prometheus/
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - ft_transcendence
    restart: always
    init: true
  grafana:
    image: grafana/grafana:13.3.1
    container_name: grafana
    ports:
      # Default login is admin/admin; keep it local.
      - "127.0.0.1:3000:3000"
    networks:
      - ft_transcendence
    restart: always
    init: true
  nginx:
    container_name: nginx
    build: ./nginx
    ports:
      - "1337:1337"
      # - "80:80"
    volumes:
      # Uploaded avatars, served at /avatars/.
      - ./backend/avatars:/srv/avatars:ro
    networks:
      - ft_transcendence
    depends_on:
      - backend
    restart: always
    init: true