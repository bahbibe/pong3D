volumes:
  dbdata:
    name: dbdata
networks:
  ft_transcendence:
    name: ft_transcendence
services:
  backend:
    container_name: backend
    build: ./backend
    volumes:
      - ./backend:/backend
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    networks:
      - ft_transcendence
    restart: always
    init: true
  db:
    image: postgres:alpine
    container_name: db
    volumes:
      - dbdata:/var/lib/postgresql/data
    env_file:
      - ./backend/.env
    networks:
      - ft_transcendence
    restart: always
    init: true
  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    networks:
      - ft_transcendence
    restart: always
    init: true
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - ft_transcendence
    env_file:
      - ./backend/.env
    restart: always
    init: true
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/:/etc/prometheus/
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - ft_transcendence
    restart: always
    init: true
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - ft_transcendence
    restart: always
    init: true
  nginx:
    container_name: nginx
    build: ./nginx
    ports:
      - "1337:1337"
      # - "80:80"
    networks:
      - ft_transcendence
    depends_on:
      - backend
    restart: always
    init: true