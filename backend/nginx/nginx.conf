# Single public origin: frontend, API, WebSockets and avatars all go through
# this server, so the browser never needs CORS and the auth cookie stays
# first-party.
server {
    listen 1337 ssl;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # Avatar uploads.
    client_max_body_size 5m;

    # Docker DNS. Upstreams are resolved at request time (proxy_pass with a
    # variable), so nginx starts even when the frontend stack is down and
    # keeps working when a container is recreated with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    set $frontend http://frontend:3001;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
    }

    location /avatars/ {
        alias /srv/avatars/;
        add_header X-Content-Type-Options nosniff always;
    }

    # /metrics and /admin/ are not proxied on purpose (local port 8000 only).

    location / {
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    return 301 https://$host$request_uri;
}
