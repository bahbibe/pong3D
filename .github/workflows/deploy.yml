name: Deploy

# Deploys the images CI pushed for a commit of main to the server over SSH.
#   - automatically after CI succeeds on a push to main
#   - by hand (Actions > Deploy > Run workflow, or `gh workflow run deploy.yml
#     -f sha=<commit>`) to roll back to an older commit; no rebuild needed.
#
# Off until the repository variable DEPLOY_ENABLED is "true". Setup and the
# secrets it needs: infra/bootstrap-vps.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit of main to deploy (full or short sha)"
        required: true

permissions:
  contents: read
  packages: read

# One deploy at a time, never cancelled halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/pong3d' }}
      SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve the commit
        id: commit
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          want="$RUN_SHA"
          [ "$EVENT" = workflow_dispatch ] && want="$INPUT_SHA"
          case "$want" in ""|*[!0-9a-f]*) echo "Not a commit sha: $want"; exit 1 ;; esac
          sha=$(git rev-parse --verify "$want^{commit}")
          git merge-base --is-ancestor "$sha" origin/main || { echo "$sha is not on main"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha: $(git log -1 --format=%s "$sha")" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that CI pushed the images
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          for image in pong3d-backend pong3d-nginx; do
            docker manifest inspect "$IMAGE_PREFIX/$image:$SHA" > /dev/null \
              || { echo "Missing $IMAGE_PREFIX/$image:$SHA (did CI build this commit?)"; exit 1; }
          done

      - name: Bundle the deploy files of that commit
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        # Compose files, Makefile, scripts, env templates, prometheus config.
        # No source code: the server runs the images.
        run: |
          git archive --format=tar.gz -o bundle.tgz "$SHA" \
            Makefile compose.yaml compose.prod.yaml .env.example env infra/scripts infra/prometheus

      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key (ssh-keyscan output checked by hand): no TOFU.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and deploy
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh_opts="-i $HOME/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes -o BatchMode=yes"
          # The folder keeps env/prod/, .env, backups/ and deployed.log; the
          # bundle only adds or replaces tracked files.
          ssh $ssh_opts "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH' && tar xzf - -C '$DEPLOY_PATH'" < bundle.tgz
          ssh $ssh_opts "$VPS_USER@$VPS_HOST" "cd '$DEPLOY_PATH' && IMAGE_PREFIX='$IMAGE_PREFIX' sh infra/scripts/deploy.sh '$SHA'"
