name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend/backend
    env:
      DJANGO_SETTINGS_MODULE: ft_transcendence.test_settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test --noinput
      - name: Deploy checks
        # Prod-like settings; test_settings is not used here.
        env:
          DJANGO_SETTINGS_MODULE: ft_transcendence.settings
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: example.org
          DJANGO_HSTS_SECONDS: "31536000"
          DJANGO_HSTS_INCLUDE_SUBDOMAINS: "1"
          JWT_SECRET: ci-only-not-a-secret
        run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" \
            python manage.py check --deploy --fail-level WARNING
