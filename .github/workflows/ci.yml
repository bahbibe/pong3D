name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0 (no moving major tag)
        with:
          # Same uv as the Dockerfile and `make lock`.
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies (exactly uv.lock, plus coverage)
        run: uv sync --locked --no-dev --group test
      - name: Check for missing migrations
        run: uv run --no-sync python manage.py makemigrations --check --dry-run
      - name: Run tests with coverage
        run: uv run --no-sync coverage run manage.py test --noinput
      - name: Coverage report (fails below fail_under in pyproject.toml)
        run: uv run --no-sync coverage report
      - name: OpenAPI schema has no warnings and docs/openapi.yaml is up to date
        run: |
          uv run --no-sync python manage.py spectacular --validate --fail-on-warn --file "$RUNNER_TEMP/openapi.yaml"
          diff -u ../docs/openapi.yaml "$RUNNER_TEMP/openapi.yaml" \
            || { echo "docs/openapi.yaml is out of date: run make openapi and commit it"; exit 1; }

  deploy-check:
    # manage.py check --deploy with prod-like settings (test_settings is not
    # used here). Fails on any warning that is not silenced in settings.py.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: example.org
      DJANGO_HSTS_SECONDS: "31536000"
      DJANGO_HSTS_INCLUDE_SUBDOMAINS: "1"
      JWT_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0 (no moving major tag)
        with:
          # Same uv as the Dockerfile and `make lock`.
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies (exactly uv.lock)
        run: uv sync --locked --no-dev
      - name: Deploy checks
        run: |
          DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')" \
            uv run --no-sync python manage.py check --deploy --fail-level WARNING

  lint:
    # Ruff and the file hooks of .pre-commit-config.yaml, on every file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0 (no moving major tag)
        with:
          version: "0.11.32"
          python-version: "3.12"
      - name: pre-commit
        run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure

  e2e:
    # Browser and websocket tests (e2e/) against the dev stack built from
    # this commit: pages, auth and 2FA, notifications, chat, games, reconnects.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0 (no moving major tag)
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: e2e/uv.lock
      - name: Start the dev stack
        run: make env && make dev
      - name: Install the e2e dependencies and Chromium
        working-directory: e2e
        run: |
          uv sync --locked
          uv run --no-sync playwright install --with-deps chromium
      - name: Run the e2e tests
        working-directory: e2e
        run: uv run --no-sync pytest
      - name: Stack logs
        if: failure()
        run: |
          mkdir -p e2e/test-results
          docker compose -f compose.yaml -f compose.dev.yaml logs --no-color > e2e/test-results/compose.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: e2e/test-results/
          retention-days: 7

  audit:
    # Known vulnerabilities in the locked runtime dependencies.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0 (no moving major tag)
        with:
          version: "0.11.32"
          python-version: "3.12"
      - name: pip-audit on uv.lock
        run: |
          uv export --frozen --no-dev --format requirements.txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --require-hashes

  ansible-lint:
    # Server provisioning playbook (infra/ansible).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ansible-lint and the collections
        run: |
          pip install ansible-lint
          ansible-galaxy collection install -r requirements.yml
      - name: Lint
        run: ansible-lint site.yml

  build:
    # Images for the server, tagged with the commit sha (and "main"). Only
    # for pushes to main, after the tests, the lint, the e2e tests, the deploy checks and the audit passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, e2e, deploy-check, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: pong3d-backend
            context: backend
            file: backend/Dockerfile
          - image: pong3d-nginx
            context: .
            file: infra/nginx/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
